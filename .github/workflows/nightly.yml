name: Nightly lab

on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrasync-lab
  cancel-in-progress: false

jobs:
  end-to-end:
    runs-on: [self-hosted, linux, x64, terrasync-lab, terrasync-rs]
    timeout-minutes: 240
    env:
      RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTUP_TOOLCHAIN: 1.95.0
      TERRASYNC_NFS3_SOURCE: 10.10.1.12:/srv/nfs/v3
      TERRASYNC_NFS41_SOURCE: 10.10.1.12:/srv/nfs/v4
      TERRASYNC_NFS3_DEST: 10.10.1.13:/srv/nfs/v3
      TERRASYNC_NFS41_DEST: 10.10.1.13:/srv/nfs/v4
      TERRASYNC_S3_SOURCE: http://10.10.1.12:9000
      TERRASYNC_S3_DEST: http://10.10.1.13:9000
      LAB_HDFS_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@hdfs-ha/
      LAB_HDFS_ADMIN_USER: hdfs/terrasync-runner@HDFS.LOCAL
      LAB_HDFS_CONFIG_DIR: /var/lib/data-mover-lab/hadoop
      LAB_HDFS_KEYTAB: /var/lib/data-mover-lab/terrasync-runner.keytab
      LAB_CIFS_USERNAME: ${{ secrets.LAB_CIFS_USERNAME }}
      LAB_CIFS_PASSWORD: ${{ secrets.LAB_CIFS_PASSWORD }}
      LAB_DXN_S3_ACCESS_KEY: ${{ secrets.LAB_DXN_S3_ACCESS_KEY }}
      LAB_DXN_S3_SECRET_KEY: ${{ secrets.LAB_DXN_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure preinstalled Rust tools
        run: echo "/home/github-runner/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify preinstalled Rust toolchain
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "1.95.0"
          cargo clippy --version
          cargo fmt --version
      - uses: Swatinem/rust-cache@v2
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --workspace --exclude terrasync-rs --locked --no-fail-fast
      - name: TS-SINGLE matrix contract
        run: python3 -m unittest tests/test_single_process_matrix.py
      - name: Remote process E2E (serial)
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --locked --test remote_process_e2e -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo build --release --locked --features lab-fault-injection
      - name: Storage and integrity E2E matrix
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: TS-SINGLE 64-cell matrix
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-single-process-matrix.sh "$RUN_ID"
      - name: Upload TS-SINGLE matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-process-matrix-${{ env.RUN_ID }}
          path: ${{ runner.temp }}/terrasync-harness-results/${{ env.RUN_ID }}-single-process
          if-no-files-found: error
      - name: HDFS single and remote process E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-hdfs-e2e.sh "$RUN_ID"
      - name: Upload HDFS certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdfs-certification-${{ env.RUN_ID }}
          path: ${{ runner.temp }}/terrasync-harness-results/${{ env.RUN_ID }}-hdfs*
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
