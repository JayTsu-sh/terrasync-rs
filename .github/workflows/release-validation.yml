name: Release validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to validate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: terrasync-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, terrasync-lab, terrasync-rs]
    environment: release
    timeout-minutes: 360
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_HDFS_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@hdfs-ha/
      LAB_HDFS_ADMIN_USER: hdfs/terrasync-runner@HDFS.LOCAL
      LAB_HDFS_CONFIG_DIR: /var/lib/data-mover-lab/hadoop
      LAB_HDFS_KEYTAB: /var/lib/data-mover-lab/terrasync-runner.keytab
      LAB_CIFS_USERNAME: ${{ secrets.LAB_CIFS_USERNAME }}
      LAB_CIFS_PASSWORD: ${{ secrets.LAB_CIFS_PASSWORD }}
      LAB_DXN_S3_ACCESS_KEY: ${{ secrets.LAB_DXN_S3_ACCESS_KEY }}
      LAB_DXN_S3_SECRET_KEY: ${{ secrets.LAB_DXN_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - name: Start from a clean release build
        run: cargo clean
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --workspace --all-features --exclude terrasync-rs --locked --no-fail-fast
      - name: TS-SINGLE matrix contract
        run: python3 -m unittest tests/test_single_process_matrix.py
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --locked --test remote_process_e2e --no-fail-fast
      - run: cargo build --release --all-features --locked
      - name: TS-SINGLE 64-cell matrix
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-single-process-matrix.sh "$RUN_ID"
      - name: Checksums
        run: sha256sum target/release/terrasync | tee release-sha256.txt
      - name: Build manifest
        run: |
          rustc --version --verbose > build-manifest.txt
          cargo --version >> build-manifest.txt
          uname -a >> build-manifest.txt
          cat release-sha256.txt >> build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terrasync-release-validation-${{ github.run_id }}
          path: |
            target/release/terrasync
            release-sha256.txt
            build-manifest.txt
            ${{ runner.temp }}/terrasync-harness-results/${{ env.RUN_ID }}-single-process
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
