name: Release validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit, or tag with TS-SINGLE lifecycle contract v2 (defaults to the dispatch commit)
        required: false

permissions:
  contents: read

concurrency:
  group: terrasync-release
  cancel-in-progress: false

jobs:
  release:
    # Runner access must also enforce the trusted workflow ref.
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, terrasync-lab, terrasync-rs]
    environment: release
    timeout-minutes: 360
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_HDFS_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@hdfs-ha/
      LAB_HDFS_ADMIN_USER: hdfs/terrasync-runner@HDFS.LOCAL
      LAB_HDFS_CONFIG_DIR: /var/lib/data-mover-lab/hadoop
      LAB_HDFS_KEYTAB: /var/lib/data-mover-lab/terrasync-runner.keytab
      LAB_DXN_S3_ACCESS_KEY: ${{ secrets.LAB_DXN_S3_ACCESS_KEY }}
      LAB_DXN_S3_SECRET_KEY: ${{ secrets.LAB_DXN_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Verify release ref belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Release validation requires a commit reachable from the main branch.'
            exit 2
          fi
      - name: Verify release ref supports the matrix lifecycle
        shell: bash
        run: |
          lifecycle=tests/lab/run-and-reconcile-single-process-matrix.sh
          if [[ ! -x "$lifecycle" || ! -x tests/lab/run-single-process-matrix.sh ||
                ! -x tests/lab/reconcile-single-process-matrix.sh || ! -x tests/lab/validate-single-process-matrix.py ||
                ! -r tests/lab/run-single-matrix-operation.py ]] ||
             ! grep -Fxq '# TS-SINGLE lifecycle contract v2' "$lifecycle"; then
            echo '::error::The selected release ref does not support TS-SINGLE lifecycle contract v2. Select a ref containing the current matrix producer and reconciler.'
            exit 2
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: tests/lab/health-check.sh
      - name: Prepare lab fixtures
        id: prepare
        run: tests/lab/prepare-run.sh "$RUN_ID"
      - name: Start from a clean release build
        run: cargo clean
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --workspace --all-features --exclude terrasync-rs --locked --no-fail-fast
      - name: TS-SINGLE matrix contract
        run: python3 -m unittest tests/test_single_process_matrix.py
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --locked --test remote_process_e2e --no-fail-fast
      - run: cargo build --release --all-features --locked
      - name: TS-SINGLE 64-cell matrix
        id: single_matrix
        if: ${{ success() && !cancelled() }}
        env:
          TS_SINGLE_DEFER_CIFS: "false"
          LAB_CIFS_NIGHTLY_USERNAME: ${{ secrets.LAB_CIFS_NIGHTLY_USERNAME }}
          LAB_CIFS_NIGHTLY_PASSWORD: ${{ secrets.LAB_CIFS_NIGHTLY_PASSWORD }}
        run: exec flock --no-fork --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-and-reconcile-single-process-matrix.sh "$RUN_ID" --direct
      - name: Recover interrupted TS-SINGLE reconciliation
        id: reconcile_matrix
        if: ${{ always() && steps.single_matrix.outputs.reconciled != 'true' && steps.single_matrix.outcome != 'skipped' && steps.single_matrix.outcome != '' }}
        timeout-minutes: 9
        env:
          MATRIX_OUTCOME: ${{ steps.single_matrix.outputs.producer_outcome }}
          LIFECYCLE_OUTCOME: ${{ job.status == 'cancelled' && 'cancelled' || steps.single_matrix.outcome }}
          FINALIZER_OUTCOME: ${{ steps.single_matrix.outputs.finalizer_outcome }}
          LAB_CIFS_NIGHTLY_USERNAME: ${{ secrets.LAB_CIFS_NIGHTLY_USERNAME }}
          LAB_CIFS_NIGHTLY_PASSWORD: ${{ secrets.LAB_CIFS_NIGHTLY_PASSWORD }}
        run: exec flock --no-fork --wait 60 /tmp/terrasync-lab-tests.lock tests/lab/reconcile-single-process-matrix.sh "$RUN_ID" --direct "$MATRIX_OUTCOME" "$LIFECYCLE_OUTCOME" "$FINALIZER_OUTCOME"
      - name: Finalize interrupted TS-SINGLE evidence
        if: >-
          ${{ always() && steps.single_matrix.outcome != 'skipped' && steps.single_matrix.outcome != '' &&
              (cancelled() || (steps.reconcile_matrix.outcome != 'success' &&
                               steps.reconcile_matrix.outcome != 'skipped' && steps.reconcile_matrix.outcome != '')) }}
        timeout-minutes: 1
        env:
          MATRIX_OUTCOME: ${{ steps.single_matrix.outputs.producer_outcome }}
          LIFECYCLE_OUTCOME: ${{ job.status == 'cancelled' && 'cancelled' || steps.single_matrix.outcome }}
          FINALIZER_OUTCOME: ${{ steps.single_matrix.outputs.finalizer_outcome }}
        run: tests/lab/reconcile-single-process-matrix.sh "$RUN_ID" --report-only "$MATRIX_OUTCOME" "$LIFECYCLE_OUTCOME" "$FINALIZER_OUTCOME"
      - name: Upload TS-SINGLE matrix evidence
        if: ${{ always() && steps.single_matrix.outcome != 'skipped' && steps.single_matrix.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: single-process-matrix-${{ env.RUN_ID }}
          path: ~/.local/state/terrasync-single-matrix/${{ env.RUN_ID }}/evidence
          if-no-files-found: ${{ steps.single_matrix.outcome == 'success' && 'error' || 'warn' }}
      - name: Checksums
        run: sha256sum target/release/terrasync | tee release-sha256.txt
      - name: Build manifest
        run: |
          rustc --version --verbose > build-manifest.txt
          cargo --version >> build-manifest.txt
          uname -a >> build-manifest.txt
          cat release-sha256.txt >> build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terrasync-release-validation-${{ github.run_id }}
          path: |
            target/release/terrasync
            release-sha256.txt
            build-manifest.txt
      - name: Cleanup
        if: ${{ always() && steps.prepare.outcome != 'skipped' && steps.prepare.outcome != '' }}
        run: tests/lab/cleanup-run.sh "$RUN_ID"
