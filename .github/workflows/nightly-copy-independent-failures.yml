name: Nightly copy independent failures

on:
  pull_request:
    paths:
      - .github/workflows/nightly-copy-independent-failures.yml
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-independent-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      COPY_FAILURE_DIR: terrasync-copy-independent-failures
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI and callback driver
        timeout-minutes: 40
        shell: bash
        run: |
          results="$RUNNER_TEMP/$COPY_FAILURE_DIR"
          mkdir -p "$results"
          cargo build --locked --bin terrasync
          cargo test --locked --profile dev -p app --test copy_generation_result --no-run \
            --message-format=json > "$RUNNER_TEMP/copy-callback-build.json"
          callback_driver=$(jq -ser '
            [.[] | select(.reason == "compiler-artifact" and .target.name == "copy_generation_result"
                         and .target.kind == ["test"] and .executable != null) | .executable]
            | if length == 1 then .[0] else error("expected one copy_generation_result executable") end
          ' "$RUNNER_TEMP/copy-callback-build.json")
          test -x "$callback_driver"
          printf 'COPY_CALLBACK_DRIVER=%s\n' "$callback_driver" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$results/build.txt"
          sha256sum "$CARGO_TARGET_DIR/debug/terrasync" "$callback_driver" >> "$results/build.txt"
      - name: Multi-shard ClickHouse independent copy failures
        shell: bash
        run: |
          results="$RUNNER_TEMP/$COPY_FAILURE_DIR"
          status=0
          for mode in cli callback; do
            driver_env=()
            if [[ "$mode" == callback ]]; then
              driver_env+=("LAB_COPY_RESULT_CALLBACK_DRIVER=$COPY_CALLBACK_DRIVER")
            fi
            sudo -n timeout --signal=INT --kill-after=30s 5m env \
              LAB_TERRASYNC_BIN="$CARGO_TARGET_DIR/debug/terrasync" \
              LAB_COPY_RESULT_LOG_DIR="$results/$mode" "${driver_env[@]}" \
              python3 tests/lab/run-notification-archive-local.py --multi-shard --copy-independent-failures \
              2>&1 | tee "$results/$mode.run.log" || status=1
          done
          exit "$status"
      - name: Upload independent copy failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-independent-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.COPY_FAILURE_DIR }}/build.txt
            ${{ runner.temp }}/${{ env.COPY_FAILURE_DIR }}/**/*.log
            ${{ runner.temp }}/${{ env.COPY_FAILURE_DIR }}/**/*.json
          if-no-files-found: warn
