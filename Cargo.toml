[package]
name = "terrasync-rs"
version = "0.1.0"
authors = ["jay.xu <jay.xu@lenovonetapp.com>"]
edition = "2024"
repository = "https://github.com/JayTsu-sh/terrasync-rs"
readme = "README.md"
license = "MIT"
keywords = ["cli", "starter"]
description = """

"""

[[bin]]
name = "terrasync"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "crates/utils",
    "crates/cli",
    "crates/app",
    "crates/db",
    "crates/licensing",
    "crates/web",
    "crates/transport",
    "crates/sync-delta",
]

# 集中管理 workspace 共享依赖，子 crate 用 `xxx = { workspace = true }` 引用。
# 外部 fork（data-mover）不锁 rev，跟随 main，Cargo.lock 提供可复现性。
[workspace.dependencies]
# 异步运行时
tokio        = { version = "1.51", features = ["full"] }
tokio-util   = { version = "0.7" }
async-trait  = "0.1"
async-channel = "2"
futures      = "0.3"
futures-util = "0.3"

# 序列化
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
bincode      = { version = "2", features = ["serde"] }

# 错误 / 日志
thiserror    = "2"
tracing      = "0.1"

# 通用工具
bytes        = "1"
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1", features = ["v4"] }
dashmap      = "6.1"
hex          = "0.4"
blake3       = "1.8"

# TLS / 加密
rustls       = { version = "0.23", default-features = false, features = ["ring", "std"] }

# HTTP 客户端
reqwest      = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# 外部 fork（跟 main，靠 Cargo.lock 保证可复现）
data-mover   = { git = "https://github.com/JayTsu-sh/data-mover-rs.git" }

# 内部 path crate
app          = { path = "crates/app" }
cli          = { path = "crates/cli" }
db           = { path = "crates/db" }
licensing    = { path = "crates/licensing" }
sync-delta   = { path = "crates/sync-delta" }
transport    = { path = "crates/transport" }
utils        = { path = "crates/utils" }
web          = { path = "crates/web" }

[workspace.lints.rust]
# 明确标记 unsafe 代码（NFS/Lustre FFI 处可局部 #[allow(unsafe_code)] 豁免）
unsafe_code = "warn"

[workspace.lints.clippy]
# 整体启用 pedantic，再针对项目特点豁免噪声规则
pedantic = { level = "warn", priority = -1 }

# ── pedantic 中对本项目干扰过大的规则 ─────────────────────────────────────────
module_name_repetitions = "allow"     # StorageError/AppError 等命名是 Rust 惯例
must_use_candidate = "allow"          # 异步函数 + 内部 API 噪声过多
missing_errors_doc = "allow"          # 内部 crate 不强制文档注释
missing_panics_doc = "allow"
wildcard_imports = "allow"            # prelude 模块需要 *
too_many_lines = "allow"              # 异步流水线函数天然较长
cast_possible_truncation = "allow"    # 文件大小/偏移量计算中常见
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
significant_drop_tightening = "allow" # 异步上下文中锁生命周期管理复杂
large_futures = "allow"               # 异步元数据/扫描路径上 future ~20KB 属正常规模，避免到处 Box::pin

# ── 强制禁止（与 CLAUDE.md 规范一致） ─────────────────────────────────────────
unwrap_used = "deny"
expect_used = "deny"

# ── 代码卫生警告 ───────────────────────────────────────────────────────────────
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
# 默认特性（运行 `cargo build` 时不指定任何特性时启用）
default = ["basic"]

# 基本功能（始终包含）
basic = []

# Profiling 特性（启用 tokio-console 客户端用于性能/异步任务分析）
profiling = ["dep:console-subscriber"]

# DuckDB特性
duckdb = ["cli/duckdb"]

# License特性
license = ["cli/license"]

# GUI 特性
gui = ["cli/gui"]

[dependencies]
cli = { workspace = true }
console-subscriber = { version = "0.5.0", optional = true }
mimalloc = "0.1"
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
serial_test = "3.4.0"
tempfile = "3"

# nfs-rs / smb 必须保留：data-mover 内部用 crates.io 写法引用它们（nfs-rs = "0.2.0"、smb = "0.12"），
# data-mover 自身的 [patch.crates-io] 在被作为依赖引入时不生效，只有 workspace root 的 patch 才生效。
# 这里的 patch 把 data-mover 内部的传递依赖替换为 fork 版本。
[patch.crates-io]
nfs-rs = { git = "https://github.com/JayTsu-sh/nfs-rs.git" }
smb    = { git = "https://github.com/JayTsu-sh/smb-rs.git" }

[lints]
workspace = true

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = "symbols"

# 火焰图专用 profile: release 级优化 + 保留调试符号
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"
