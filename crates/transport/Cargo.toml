[package]
name = "transport"
version = "0.1.0"
edition = "2024"

[features]
default = []
quic = ["dep:quinn", "dep:rcgen", "dep:rustls", "dep:bincode", "dep:tracing", "dep:zstd", "tokio/rt"]

[dependencies]
async-channel = { workspace = true }
async-trait   = { workspace = true }
bytes         = { workspace = true, features = ["serde"] }
serde         = { workspace = true, features = ["rc"] }
data-mover    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { version = "1.51.1", features = ["sync"] }

# QUIC 可选依赖（feature = "quic" 时启用）
quinn   = { version = "0.11", optional = true }
rcgen   = { version = "0.13", optional = true }
rustls  = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zstd    = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["full", "test-util"] }

[lints]
workspace = true
