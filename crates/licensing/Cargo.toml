[package]
name = "licensing"
version = "1.0.0"
edition = "2024"
description = "License generation, activation, and verification for terrasync"

[features]
default = []
generate = ["dep:uuid", "dep:rand", "dep:clap"]

[dependencies]
# 签名与 HMAC
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
hex = { workspace = true }
chrono = { workspace = true }

# 错误处理与日志
thiserror = { workspace = true }
tracing = { workspace = true }

# 仅生成工具需要（feature-gated）
uuid = { workspace = true, optional = true }
# rand 0.8 是 licensing 当前 OsRng/RngCore 写法所需的版本
rand = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "license-gen"
path = "src/bin/license_gen.rs"
required-features = ["generate"]

[lints]
workspace = true
