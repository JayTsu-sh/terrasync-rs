[package]
name = "licensing"
version = "1.0.0"
edition = "2024"
description = "License generation, activation, and verification for terrasync"

[features]
default = []
generate = ["dep:uuid", "dep:rand", "dep:clap"]

[dependencies]
# 签名与 HMAC
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# 错误处理与日志
thiserror = "2"
tracing = "0.1"

# 仅生成工具需要（feature-gated）
uuid = { version = "1", features = ["v4"], optional = true }
rand = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "license-gen"
path = "src/bin/license_gen.rs"
required-features = ["generate"]

[lints]
workspace = true
