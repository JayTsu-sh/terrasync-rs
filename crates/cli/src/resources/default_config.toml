[license]
path = "license.json"     # Path to license file (relative or absolute)

[log]
# Log file rotation configuration
max_size = 100           # Maximum size in megabytes of the log file before it gets rotated (default: 100)
max_backups = 10         # Maximum number of old log files to retain (default: 10)
level = "info"           # Log level: "debug", "info", "warn", "error" (default: "info")
enable_json = false      # Enable JSON structured logging to app.json.log (default: false)

[scan]
# Scan related configuration
concurrency = 8          # Concurrency threads for scan operation (default: 8)
include_tags = false     # Include tags of S3 object in scan results (default: false)

[sync]
# Synchronization related configuration
is_source_reserved = true  # Reserve the source files when syncing (default: false)
concurrency = 8            # Concurrency level for migration operations (default: 8)

[integrity_check]
# Integrity check configuration
concurrency = 8            # Concurrency level for integrity check operations (default: 8)
mtime_precision = "auto"   # "auto" normalizes backend timestamp precision; "exact" compares nanoseconds
mtime_tolerance_ms = 0      # Additional allowed timestamp difference in milliseconds

[delete]
# Delete operation configuration
concurrency = 8            # Concurrency level for delete operations (default: 8)

# HDFS client state is role-scoped. Add `[storage.source.hdfs]` and/or
# `[storage.destination.hdfs]` only when an hdfs:// location is used.
# config_dir = "/etc/hadoop/conf"
# [storage.source.hdfs.kerberos]
# principal = "hdfs/user@REALM"
# keytab = "/run/secrets/source.keytab"
# cache = "FILE:/run/terrasync/source.ccache"

[database]
# Database integration configuration
enabled = true           # Enable Database integration (default: true)
type = "clickhouse"       # Only ClickHouse is supported
batch_size = 800000       # Batch size for file entries

[database.clickhouse]
# ClickHouse specific configuration
dsn = "http://localhost:8123"  # DSN format: http://host:port
dial_timeout = 5          # Connection timeout (seconds)
read_timeout = 30         # Read timeout (seconds)
database = "default"      # Database name
username = "default"      # Username
password = ""             # Password

#[database.mariadb]
# MariaDB specific configuration (Lustre fast_scan only)
#dsn = "mysql://root:@127.0.0.1:3306/terrasync"
#pool_min = 2              # Min pool connections (default: 2)
#pool_max = 10             # Max pool connections (default: 10)
#connect_timeout = 5       # Connection timeout in seconds
#idle_timeout = 300        # Idle connection timeout in seconds
#sync_to_clickhouse = false # Enable async sync to ClickHouse
#sync_interval = 60        # Sync interval in seconds
