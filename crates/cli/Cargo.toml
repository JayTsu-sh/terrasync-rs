[package]
name = "cli"
version = "0.1.0"
authors = ["jay.xu <jay.xu@lenovonetapp.com>"]
description = "CLI interface for terrasync"
edition = "2024"

[features]
license = ["dep:licensing", "app/license"]
gui = ["dep:web"]
lab-fault-injection = ["app/lab-fault-injection"]

[dependencies]
app        = { workspace = true }
licensing  = { workspace = true, optional = true }
data-mover = { workspace = true }
rustls     = { workspace = true }
transport  = { workspace = true, features = ["quic"] }
web        = { workspace = true, optional = true }
chrono     = { workspace = true }
tracing    = { workspace = true }
thiserror  = { workspace = true }
utils      = { workspace = true }

[dependencies.clap]
version = "4.6.0"
features = ["cargo", "derive"]

[lints]
workspace = true
