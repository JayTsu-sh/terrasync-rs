[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 工具
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
dashmap = "6.1.0"
futures-util = "0.3"

# 静态文件嵌入
rust-embed = "8"
mime_guess = "2"

# Workspace 依赖
app = { path = "../app" }
utils = { path = "../utils" }
data-mover = { git = "https://github.com/JayTsu-sh/data-mover-rs.git" }

[lints]
workspace = true
