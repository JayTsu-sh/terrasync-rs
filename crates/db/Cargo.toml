[package]
name = "db"
version = "0.2.0"
edition = "2024"

[dependencies]
task-model = { workspace = true }
async-trait = { workspace = true }
blake3      = { workspace = true }
bytes       = { workspace = true }
# 主依赖不带 test-util，避免测试辅助代码进入生产二进制
clickhouse  = { version = "0.14.3", features = ["uuid", "time"] }
hex         = { workspace = true }
hyper       = { version = "1.11", features = ["client", "http1"] }
hyper-util  = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-timeout = "0.5.2"
tower-service = "0.3"
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
data-mover  = { workspace = true }
thiserror   = { workspace = true }
# 查询取消与副本重试使用任务局部上下文、定时器和有界通道。
tokio       = { version = "1.51", features = ["sync", "rt", "macros", "time"] }
tokio-util  = { workspace = true, features = ["rt"] }
utils       = { workspace = true }
uuid        = { workspace = true }
smol_str    = { workspace = true }
rustc-hash  = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bytes      = { workspace = true }
# 测试启用 clickhouse test-util（mock server / fixtures）
clickhouse = { version = "0.14.3", features = ["uuid", "time", "test-util"] }
tokio      = { version = "1.51", features = ["rt-multi-thread", "macros", "test-util"] }
