[package]
name = "db"
version = "0.2.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
bytes       = { workspace = true }
# 主依赖不带 test-util，避免测试辅助代码进入生产二进制
clickhouse  = { version = "0.14.3", features = ["uuid", "time"] }
dashmap     = { workspace = true }
hex         = { workspace = true }
tracing     = { workspace = true }
once_cell   = "1.21"
serde       = { workspace = true }
serde_json  = { workspace = true }
data-mover  = { workspace = true }
thiserror   = { workspace = true }
# db 实际只用 tokio::sync::mpsc 和 tokio::task::{spawn_blocking, JoinError}
tokio       = { version = "1.51", features = ["sync", "rt"] }
utils       = { workspace = true }
uuid        = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bytes      = { workspace = true }
# 测试启用 clickhouse test-util（mock server / fixtures）
clickhouse = { version = "0.14.3", features = ["uuid", "time", "test-util"] }
tokio      = { version = "1.51", features = ["rt-multi-thread", "macros"] }
