[package]
name = "db"
version = "0.2.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1.11.1"
clickhouse = { version = "0.14.3", features = ["uuid", "time", "test-util"] }
dashmap = "6.1.0"
hex = "0.4.3"
tracing = "0.1.44"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
data-mover = { git = "https://github.com/JayTsu-sh/data-mover-rs.git" }
thiserror = "2.0.18"
tokio = { version = "1.51", features = ["full"] }
utils = { path = "../utils" }
uuid = { version = "1.23.0", features = ["v4"] }

[features]
duckdb = ["dep:duckdb"]

[target.'cfg(windows)'.dependencies]
duckdb = { version = "1.10501.0", features = ["chrono"], optional = true }

[target.'cfg(not(windows))'.dependencies]
duckdb = { version = "1.10501.0", features = [
    "chrono",
    "bundled",
], optional = true }

[lints]
workspace = true

[dev-dependencies]
bytes = "1.11.1"
tokio = { version = "1.51", features = ["rt-multi-thread", "macros"] }
